<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8">
    <title>Portfolio - Tharatorn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 1.3: Form Validation</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
      body {
        font-family: 'Sarabun', sans-serif;
        margin: 0;
        background-color: #f0f2f5;
        color: #333;
        line-height: 1.6;
      }
      
      header {
        background: linear-gradient(135deg, #1b0694, #4a32d8);
        color: white;
        padding: 40px 20px;
        text-align: center;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }

      .card {
        background: white;
        max-width: 500px;
        margin: -50px auto 30px auto;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        text-align: center;
      }

      img {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        object-fit: cover;
        border: 5px solid #f0f2f5;
        margin-bottom: 20px;
      }

      .info {
        text-align: left;
        display: inline-block;
        margin-top: 15px;
      }

      footer {
        background: #251e88;
        color: #d1d1d1;
        text-align: center;
        padding: 20px;
        font-size: 0.9em;
      }

      h2 { color: #1b0694; margin-top: 0; }
    </style>
  </head>
  <body>

    <header>
      <h1>Welcome to My Portfolio</h1>
    </header>

    <div class="card">
      <img src="hand_01_2.jpg" alt="My Profile Picture" />
      <h2>About Me</h2>
      <div class="info">
        <p><strong>ชื่อ:</strong> ธราธร</p>
        <p><strong>รหัสนักศึกษา:</strong> 67146201</p>
      </div>
    </div>

    <footer>
      CSI204
    </footer>

  </body>
</html>
