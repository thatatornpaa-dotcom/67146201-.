<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 1.4: Form Validation</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ตั้งค่าพื้นฐานธีม Dark Mode */
        :root {
            --bg-color: #0f172a;       /* สีน้ำเงินเข้ม Slate 900 */
            --card-bg: #1e293b;        /* สีน้ำเงิน Slate 800 */
            --text-main: #f8fafc;      /* ขาวสว่าง */
            --text-muted: #94a3b8;     /* เทา Slate 400 */
            --accent-color: #3b82f6;   /* ฟ้าสว่าง */
            --accent-hover: #2563eb;   /* ฟ้าน้ำเงิน */
            --input-bg: #0f172a;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* กล่องฟอร์มดีไซน์ล้ำสมัย */
        .form-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 440px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            border: 1px solid #334155;
        }

        h2 {
            font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        /* จัดกรุ๊ป Input แต่ละช่อง */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        /* กล่องกรอกข้อมูล */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 15px;
            color: var(--text-main);
            background-color: var(--input-bg);
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* เปลี่ยนสีข้อความ label เมื่อคลิกโฟกัสช่องป้อนข้อมูล */
        .form-group:focus-within label {
            color: var(--accent-color);
        }

        /* ปุ่มส่งข้อมูล */
        .btn-submit {
            width: 100%;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
            font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="form-card">
        <h2>ฟอร์มสมัครสมาชิก</h2>
        <p class="subtitle">Lab 1.4: Form Validation แบบตรวจสอบข้อมูล</p>
        
        <form onsubmit="return validateForm();">
            <div class="form-group">
                <label for="name">ชื่อผู้ใช้งาน</label>
                <input type="text" id="name" placeholder="กรอกชื่อ-นามสกุลของคุณ" />
            </div>

            <div class="form-group">
                <label for="email">อีเมลบัญชี</label>
                <input type="text" id="email" placeholder="example@domain.com" />
            </div>

            <div class="form-group">
                <label for="phone">เบอร์โทรศัพท์</label>
                <input type="text" id="phone" placeholder="ระบุเบอร์โทรศัพท์ 10 หลัก" />
            </div>

            <div class="form-group">
                <label for="password">รหัสผ่านบัญชี</label>
                <input type="password" id="password" placeholder="ต้องมีความยาวอย่างน้อย 6 ตัวอักษร" />
            </div>

            <button type="submit" class="btn-submit">ส่งข้อมูลสมัครสมาชิก</button>
        </form>
    </div>

    <script>
      function validateForm() {
        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let phone = document.getElementById("phone").value.trim();
        let password = document.getElementById("password").value;
        let errors = [];

        if (name === "") errors.push("Please enter your name");
        if (email === "" || !email.includes("@"))
          errors.push("Please enter a valid email address");
        if (phone === "" || phone.length < 9 || isNaN(phone))
          errors.push("Please enter a valid 10-digit phone number");
        if (password.length < 6)
          errors.push("Password must be at least 6 characters long");

        if (errors.length > 0) {
          alert(errors.join("\n"));
          return false;
        }
        alert("Registration successful!");
        return true;
      }
    </script>
</body>
</html>
