<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 1.5: LocalStorage</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ตั้งค่าตัวแปรโทนสีสดใสสไตล์ Tech-Modern */
        :root {
            --bg-app: #f5f3ff;        /* สีม่วงพาสเทลจางๆ */
            --primary: #4f46e5;       /* ม่วง Indigo */
            --primary-hover: #4338ca;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --danger: #ef4444;        /* แดงสำหรับปุ่มลบ */
            --danger-hover: #dc2626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        /* กล่องคอนเทนเนอร์หลัก แบ่งสองฝั่งแบบสมมาตร */
        .dashboard-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        /* สไตล์การ์ดทั่วไป */
        .app-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.05), 0 8px 10px -6px rgba(79, 70, 229, 0.05);
            border: 1px solid var(--border-color);
        }

        h2, h3 {
            font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif;
            font-weight: 700;
            color: #111827;
            margin-bottom: 20px;
        }

        h2 { font-size: 22px; text-align: center; border-bottom: 2px solid #f3f4f6; padding-bottom: 15px; }
        h3 { font-size: 18px; display: flex; align-items: center; gap: 8px; }

        /* จัดหน้าฟอร์มกรอก */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        label {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 11px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14.5px;
            color: var(--text-main);
            background-color: #f9fafb;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        /* ส่วนของปุ่มกด */
        button {
            width: 100%;
            border: none;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit {
            background-color: var(--primary);
            color: #ffffff;
            margin-top: 8px;
        }

        .btn-submit:hover { background-color: var(--primary-hover); }

        .btn-clear {
            background-color: #fff5f5;
            color: var(--danger);
            border: 1px solid #fee2e2;
            margin-top: 20px;
        }

        .btn-clear:hover {
            background-color: var(--danger);
            color: #ffffff;
            border-color: var(--danger);
        }

        /* ตกแต่งส่วนแสดงรายชื่อฝั่งขวา */
        .user-list-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .user-ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 310px;
            overflow-y: auto; /* เผื่อกรณีรายชื่อยาวเกินจะสกรอลล์ได้ */
            padding-right: 4px;
        }

        .user-li {
            background-color: #f9fafb;
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info-text {
            font-weight: 500;
        }

        .user-email-text {
            color: var(--text-muted);
            font-size: 13px;
        }

        .empty-state {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            padding: 40px 0;
            font-style: italic;
        }

        /* รองรับขนาดหน้าจอมือถือ */
        @media (max-width: 768px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <div class="app-card">
            <h2>ฟอร์มสมัครสมาชิก</h2>
            <form onsubmit="return validateForm(event);" style="margin-top: 20px;">
                <div class="form-group">
                    <label for="name">ชื่อผู้ใช้งาน</label>
                    <input type="text" id="name" placeholder="กรอกชื่อ-นามสกุล" />
                </div>
                <div class="form-group">
                    <label for="email">อีเมล</label>
                    <input type="text" id="email" placeholder="example@email.com" />
                </div>
                <div class="form-group">
                    <label for="phone">เบอร์โทรศัพท์</label>
                    <input type="text" id="phone" placeholder="ระบุเบอร์โทร" />
                </div>
                <div class="form-group">
                    <label for="password">รหัสผ่าน</label>
                    <input type="password" id="password" placeholder="อย่างน้อย 6 ตัวอักษร" />
                </div>
                <button type="submit" class="btn-submit">ส่งข้อมูลสมัครสมาชิก</button>
            </form>
        </div>

        <div class="app-card user-list-wrapper">
            <div id="userList" style="flex-grow: 1;">
                </div>
            <button class="btn-clear" onclick="clearStorage()">🗑️ ลบข้อมูลทั้งหมดในระบบ</button>
        </div>

    </div>

    <script>
      window.onload = function () {
        displayUsers();
      };

      function validateForm(event) {
        event.preventDefault(); // ป้องกันการรีเฟรชหน้าตาตามมาตรฐานของฟอร์ม
        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let phone = document.getElementById("phone").value.trim();
        let password = document.getElementById("password").value;
        let errors = [];

        if (name === "") errors.push("Please enter your name");
        if (email === "" || !email.includes("@"))
          errors.push("Please enter a valid email address");
        if (phone === "" || phone.length < 9 || isNaN(phone))
          errors.push("Please enter a valid 10-digit phone number");
        if (password.length < 6)
          errors.push("Password must be at least 6 characters long");

        if (errors.length > 0) {
          alert(errors.join("\n"));
          return false;
        }

        alert("Registration successful!");

        saveToLocalStorage({ name, email, phone, password });

        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("password").value = "";

        return true;
      }

      function saveToLocalStorage(userData) {
        let users = JSON.parse(localStorage.getItem("users")) || [];
        users.push(userData);
        localStorage.setItem("users", JSON.stringify(users));
        displayUsers();
      }

      function displayUsers() {
        let users = JSON.parse(localStorage.getItem("users")) || [];
        let html = "<h3>👥 Registered Users</h3>";
        
        if(users.length > 0) {
            html += "<ul class='user-ul'>";
            users.forEach((user, index) => {
              html += `
                <li class="user-li">
                    <span class="user-info-text">${index + 1}. ${user.name}</span>
                    <span class="user-email-text">${user.email}</span>
                </li>`;
            });
            html += "</ul>";
        } else {
            html += "<p class='empty-state'>ยังไม่มีรายชื่อผู้ลงทะเบียนในระบบ</p>";
        }
        
        document.getElementById("userList").innerHTML = html;
      }

      function clearStorage() {
        if(confirm("คุณแน่ใจใช่ไหมที่จะลบข้อมูลทั้งหมด?")) {
            localStorage.removeItem("users");
            displayUsers();
            alert("Data cleared successfully");
        }
      }
    </script>
</body>
</html>
