<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบแปลงหน่วยวัด (lab6_1)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .converter-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { color: #2d3436; text-align: center; margin-bottom: 25px; }
        label { font-weight: 600; color: #636e72; display: block; margin-bottom: 8px; }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #00b894;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #009475; }
        #result {
            margin-top: 25px;
            padding: 20px;
            background-color: #e3fcef;
            border-radius: 12px;
            border-left: 6px solid #00b894;
            display: none;
        }
    </style>
</head>
<body>

    <div class="converter-card">
        <h2>🛠️ ระบบแปลงหน่วยวัด</h2>
        
        <label>ค่าที่ต้องการแปลง:</label>
        <input type="number" id="inputValue" placeholder="ระบุตัวเลขที่นี่">
        
        <label>ประเภทการแปลง:</label>
        <select id="convertType">
            <option value="kgToLb">กิโลกรัม เป็น ปอนด์ (kg to lbs)</option>
            <option value="cToF">เซลเซียส เป็น ฟาเรนไฮต์ (°C to °F)</option>
            <option value="kmToMile">กิโลเมตร เป็น ไมล์ (km to miles)</option>
        </select>
        
        <button onclick="convertUnit()">แปลงหน่วยทันที</button>
        
        <div id="result"></div>
    </div>

    <script>
    function convertUnit() {
        let inputRaw = document.getElementById("inputValue").value;
        
        if (inputRaw === "") {
            alert("กรุณากรอกตัวเลขที่ต้องการแปลงหน่วยครับ");
            return;
        }

        let value = parseFloat(inputRaw);
        let type = document.getElementById("convertType").value;
        let resultValue = 0;
        let fromUnit = "", toUnit = "";

        switch (type) {
            case "kgToLb":
                resultValue = value * 2.20462;
                fromUnit = "กิโลกรัม (kg)";
                toUnit = "ปอนด์ (lbs)";
                break;
            case "cToF":
                resultValue = (value * 9/5) + 32;
                fromUnit = "เซลเซียส (°C)";
                toUnit = "ฟาเรนไฮต์ (°F)";
                break;
            case "kmToMile":
                resultValue = value * 0.621371;
                fromUnit = "กิโลเมตร (km)";
                toUnit = "ไมล์ (miles)";
                break;
        }

        let resultDiv = document.getElementById("result");
        resultDiv.style.display = "block";
        resultDiv.innerHTML = `
            <h4 style="margin:0 0 10px 0;">ผลลัพธ์การแปลง:</h4>
            <p style="margin:5px 0;">ค่าเดิม: <strong>${value.toFixed(2)} ${fromUnit}</strong></p>
            <p style="margin:5px 0; color: #006d56;">แปลงได้: <strong>${resultValue.toFixed(4)} ${toUnit}</strong></p>
        `;
    }
    </script>

</body>
</html>
